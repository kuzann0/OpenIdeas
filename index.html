<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenIdeas</title>
  <style>
    /* Apple Light Mode Design System */
    :root {
      --bg: #F5F5F7;               /* Canvas light gray */
      --card-bg: #FFFFFF;          /* Surface white */
      --field-bg: #FAFAFC;         /* Soft input fill */
      --border: #E5E5EA;           /* Light border */
      --border-focus: #c7c7c7;     /* Subtle focus border */
      --text-primary: #1D1D1F;     /* Primary dark text */
      --text-secondary: #86868B;   /* Subtext gray */
      
      /* Updated Seamless White Button Colors */
      --btn-bg: #FFFFFF;           /* Seamless white background */
      --btn-hover: #F2F2F7;        /* Soft dirty-white / off-white hover */
      --btn-border: #E5E5EA;       /* Subtle border matching card UI */
      --btn-text: #3A3A3C;         /* Soft black text */
      --btn-text-hover: #1D1D1F;   /* Gentle dark black text on hover */
      
      --success: #34C759;
      --error: #FF3B30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Input Container Card */
    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 
        0 10px 30px -5px rgba(0, 0, 0, 0.04),
        0 2px 8px -2px rgba(0, 0, 0, 0.02);
      text-align: center;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      height: 110px;
      background-color: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    textarea:focus {
      background-color: #FFFFFF;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
    }

    textarea::placeholder {
      color: #98989D;
    }

    /* Seamless White Premium Button */
    button {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      border-radius: 980px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      /* Smooth dark grey multi-layer drop shadow */
      box-shadow: 
        0 4px 12px -2px rgba(0, 0, 0, 0.06),
        0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    button:hover {
      background-color: var(--btn-hover);
      color: var(--btn-text-hover);
      border-color: #D1D1D6;
      /* Deepened subtle dark grey shadow on hover */
      box-shadow: 
        0 6px 16px -2px rgba(0, 0, 0, 0.08),
        0 2px 6px -1px rgba(0, 0, 0, 0.04);
    }

    button:active {
      transform: scale(0.98);
      box-shadow: 
        0 2px 6px -1px rgba(0, 0, 0, 0.04);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      min-height: 18px;
    }

    .success { color: var(--success); }
    .error { color: var(--error); }

    /* Feed & Minimal White Chat Bubbles */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .chat-bubble {
      background: var(--card-bg);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 18px;
      padding: 16px 20px;
      text-align: left;
      /* Smooth multi-layered drop shadow */
      box-shadow: 
        0 4px 20px -2px rgba(0, 0, 0, 0.04),
        0 2px 6px -1px rgba(0, 0, 0, 0.02);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chat-bubble:hover {
      transform: translateY(-1px);
      box-shadow: 
        0 6px 24px -2px rgba(0, 0, 0, 0.06),
        0 2px 8px -1px rgba(0, 0, 0, 0.03);
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #F2F2F7;
    }

    .chat-message {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      word-break: break-word;
      white-space: pre-wrap;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="container">
      <h1>OpenIdeas</h1>
      <p class="subtitle">Share your thoughts and ideas with the world.</p>

      <div class="form-group">
        <textarea id="noteInput" placeholder="Your idea..."></textarea>
        <button id="submitBtn" onclick="sendData()">Submit Idea</button>
      </div>

      <div id="status"></div>
    </div>

    <!-- Live Local Chat Feed -->
    <div class="feed" id="chatFeed"></div>
  </div>

  <script>
    const WEBHOOK_URL = "https://gold-mosquito-565337.hostingersite.com/webhook/c1036564-040d-49cc-96d1-720d52b7ebd6";

    // Returns persistent pseudo-MAC ID (e.g. H-A2:4B:C6:81:DF:09)
    function getDeviceId() {
      let deviceId = localStorage.getItem('user_device_hid');
      if (!deviceId) {
        const macBytes = Array.from({ length: 6 }, () => 
          Math.floor(Math.random() * 256).toString(16).padStart(2, '0').toUpperCase()
        ).join(':');
        
        deviceId = `H-${macBytes}`;
        localStorage.setItem('user_device_hid', deviceId);
      }
      return deviceId;
    }

    // Formats Philippine Standard Time timestamp: (hh:mm:ss:ms AM/PM-MM/DD/YYYY)
    function getPhTimestamp() {
      const now = new Date();
      const phDate = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Manila" }));
      
      let hours = phDate.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;

      const hh = String(hours).padStart(2, '0');
      const mm = String(phDate.getMinutes()).padStart(2, '0');
      const ss = String(phDate.getSeconds()).padStart(2, '0');
      const ms = String(Math.floor(now.getMilliseconds() / 10)).padStart(2, '0');

      const month = String(phDate.getMonth() + 1).padStart(2, '0');
      const day = String(phDate.getDate()).padStart(2, '0');
      const year = phDate.getFullYear();

      return `(${hh}:${mm}:${ss}:${ms} ${ampm}-${month}/${day}/${year})`;
    }

    function addChatBubble(deviceId, timestamp, message) {
      const feed = document.getElementById('chatFeed');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      
      bubble.innerHTML = `
        <div class="chat-header">
          <span>${deviceId}</span>
          <span>${timestamp}</span>
        </div>
        <div class="chat-message">${message}</div>
      `;
      
      feed.prepend(bubble);
    }

    async function sendData() {
      const textarea = document.getElementById('noteInput');
      const button = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const text = textarea.value.trim();

      if (!text) {
        status.className = 'error';
        status.textContent = 'Please enter some text before submitting.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Sending...';
      status.textContent = '';

      const deviceId = getDeviceId();
      const timestamp = getPhTimestamp();

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain'
          },
          body: JSON.stringify({
            message: text,
            deviceId: deviceId,
            timestamp: new Date().toISOString()
          })
        });

        if (response.ok) {
          status.className = 'success';
          status.textContent = 'Message sent successfully!';
          addChatBubble(deviceId, timestamp, text);
          textarea.value = '';
        } else {
          status.className = 'error';
          status.textContent = `Server returned status: ${response.status}`;
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Error triggering webhook. Check CORS settings or Webhook URL.';
        console.error(err);
      } finally {
        button.disabled = false;
        button.textContent = 'Submit Idea';
      }
    }
  </script>

</body>
</html>
