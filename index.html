<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTest Webhook Trigger</title>
  <style>
    /* Apple Light Mode Palette */
    :root {
      --bg: #F5F5F7;               /* Apple canvas light gray */
      --card-bg: #FFFFFF;          /* Pure white card surface */
      --field-bg: #FAFAFC;         /* Soft input fill */
      --border: #E5E5EA;           /* Crisp light border */
      --border-focus: #0071E3;     /* Apple web interactive blue */
      --text-primary: #1D1D1F;     /* Apple primary dark text */
      --text-secondary: #86868B;   /* Apple subtext gray */
      --btn-bg: #0071E3;           /* Apple primary blue button */
      --btn-hover: #0077ED;
      --success: #34C759;
      --error: #FF3B30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      height: 120px;
      background-color: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      background-color: #FFFFFF;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }

    textarea::placeholder {
      color: #98989D;
    }

    button {
      background-color: var(--btn-bg);
      color: #FFFFFF;
      border: none;
      border-radius: 980px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--btn-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
    }

    .success { color: var(--success); }
    .error { color: var(--error); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sync Note</h1>
    <p class="subtitle">Enter your message below to send directly to Google Docs via n8n.</p>

    <div class="form-group">
      <textarea id="noteInput" placeholder="Write something clean and thoughtful..."></textarea>
      <button id="submitBtn" onclick="sendData()">Submit Note</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // REPLACE THIS URL WITH YOUR N8N WEBHOOK TEST / PRODUCTION URL
    const WEBHOOK_URL = "https://gold-mosquito-565337.hostingersite.com/webhook/c1036564-040d-49cc-96d1-720d52b7ebd6";

    async function sendData() {
      const textarea = document.getElementById('noteInput');
      const button = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const text = textarea.value.trim();

      if (!text) {
        status.className = 'error';
        status.textContent = 'Please enter some text before submitting.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Sending...';
      status.textContent = '';

      try {
        const response = await fetch(WEBHOOK_URL, {
  method: 'POST',
  headers: {
    'Content-Type': 'text/plain' // Prevents browser CORS OPTIONS preflight
  },
  body: JSON.stringify({
    message: text,
    timestamp: new Date().toISOString()
  })
});

        if (response.ok) {
          status.className = 'success';
          status.textContent = 'Successfully sent to n8n!';
          textarea.value = '';
        } else {
          status.className = 'error';
          status.textContent = `Server returned status: ${response.status}`;
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Error triggering webhook. Check CORS settings or Webhook URL.';
        console.error(err);
      } finally {
        button.disabled = false;
        button.textContent = 'Submit Note';
      }
    }
  </script>

</body>
</html>
